context:
  version: "1.2.2"

package:
  name: beads
  version: ${{ version }}

source:
  - url: https://github.com/gastownhall/beads/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 892b8b641d1f9eb3fa9f0cddf704f3f41aea0da872e546fe623ddec30b2ea9cf
  # the following dependencies miss standard license file layout, so we have to manually add their license files
  # (`github.com/dolthub/eventkit` has no license)
  - url: https://raw.githubusercontent.com/apache/arrow-go/main/LICENSE.txt
    sha256: ff2fe52b8dfd2574c6ea7f0c407948c857f62672c2a3a9a17083ee10af8067ef
    target_directory: library_licenses_2/github.com/apache/arrow-go
  - url: https://raw.githubusercontent.com/apache/thrift/master/LICENSE
    sha256: 89aa7b27868669299bd8a6c53b72ec4beadce42dad6c8336797cc26e1e8df98d
    target_directory: library_licenses_2/github.com/apache/thrift
  - url: https://raw.githubusercontent.com/kch42/buzhash/master/LICENSE
    sha256: e36eb71189a6d30b09337cbf5fb5155f7286bc0e728d5fbad163723abc6b170c
    target_directory: library_licenses_2/github.com/kch42/buzhash
  - url: https://raw.githubusercontent.com/mattn/go-localereader/master/LICENSE
    sha256: dceede03550621e65ec7b79fcba87cf6dbb9d31132a8ae71a8fe8ceec0af7da3
    target_directory: library_licenses_2/github.com/mattn/go-localereader

build:
  number: 0
  script:
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      # upstream refs: https://github.com/gastownhall/beads/blob/main/docs/INSTALLING.md & https://github.com/gastownhall/beads/blob/main/.goreleaser.yml
      - let default_branch = (http get https://api.github.com/repos/gastownhall/beads).default_branch
      - let commit_hash = (http get https://api.github.com/repos/gastownhall/beads/commits/v${{ version }}).sha
      - let short_commit_hash = ($commit_hash | str substring 0..6)
      - go build
        -o=($prefix)/bin/
        -v
        -ldflags=$'-s -w -X main.Branch=($default_branch) -X main.Build=($short_commit_hash) -X main.Commit=($commit_hash) -X main.Version=${{ version }}'
        -tags=gms_pure_go
        -trimpath
        ./cmd/bd
      - go-licenses save ./cmd/bd
        --save_path=library_licenses
        --ignore=github.com/apache/arrow/go/arrow
        --ignore=github.com/apache/thrift/lib/go/thrift
        --ignore=github.com/dolthub/eventkit
        --ignore=github.com/dolthub/eventkit/transport/ga4
        --ignore=github.com/kch42/buzhash
        --ignore=github.com/mattn/go-localereader
      # merge library license files
      - cp --recursive library_licenses_2/* library_licenses/
      - rm --recursive library_licenses_2
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/bd
          - ^$bin completion bash | save ($prefix)/share/bash-completion/completions/bd
          - ^$bin completion fish | save ($prefix)/share/fish/vendor_completions.d/bd.fish
          - ^$bin completion zsh  | save ($prefix)/share/zsh/site-functions/_bd

requirements:
  build:
    # Build fails on both Windows and macOS with CGO enabled. On macOS, CGO-enabled code links the Security/CoreFoundation symbol
    # `_SecTrustCopyCertificateChain` which apparently isn't available. The error on Windows is unclear (truncated from logs). Disabling CGO implies not
    # embedding the default Dolt backend, which means the resulting Windows and macOS binaries require a running `dolt sql-server`.
    - if: linux
      then:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('go-cgo') }}
      else:
        - ${{ compiler('go-nocgo') }}
    - go-licenses
    - nushell

tests:
  - script:
      env:
        BEADS_DOLT_AUTO_START: "0"
        BD_DISABLE_EVENT_FLUSH: "1"
        BD_DISABLE_METRICS: "1"
        BD_NO_DAEMON: "1"
      content:
        - bd --help
        - bd --version
  - package_contents:
      bin:
        - bd
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/bd
            - share/fish/vendor_completions.d/bd.fish
            - share/zsh/site-functions/_bd
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/bd
            - Library/share/fish/vendor_completions.d/bd.fish
            - Library/share/zsh/site-functions/_bd
      strict: true

about:
  summary: A developer-centric issue tracker that lives in your Git repo
  description: |
    Beads (bd) is a fast, local-first CLI issue tracker designed for software
    teams and AI agents. It stores issues alongside your code in a Dolt
    (MySQL-compatible) database, supports hierarchical issues, dependencies,
    molecules (multi-step workflows), integrations with GitHub/GitLab/Jira/Linear,
    and MCP server support for AI agents.
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  homepage: https://github.com/gastownhall/beads
  documentation: https://github.com/gastownhall/beads/tree/main/docs
  repository: https://github.com/gastownhall/beads

extra:
  recipe-maintainers:
    - maphew
    - salim-b
